name: Scrapear pronósticos

# Los PRONÓSTICOS casi no cambian una vez publicados, pero las casas los
# publican recién cuando el partido está cerca. Con 12h de cadencia el
# pronóstico de una ronda nueva podía entrar tarde (o después del pitazo).
# Cada 3h cierra esa ventana sin pegarle de más a Forebet/Vitibet (evitar baneos).
on:
  schedule:
    - cron: "0 */3 * * *" # cada 3 horas (UTC)
  workflow_dispatch: {} # correr a mano cuando quieras

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # PredictZ y WinDrawWin se scrapean con Playwright → hace falta chromium
      - run: npx playwright install --with-deps chromium
      # Antes de scrapear, persistimos los partidos de eliminatoria ya
      # confirmados (16avos, después octavos, etc.) para que el scrape tenga
      # contra qué cruzar sus pronósticos.
      - run: npm run seed:knockout
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      - run: npm run scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Opcionales: si alguna fuente publica el Mundial en una URL distinta
          # a la default, definila como secret (FOREBET_URL, VITIBET_URL,
          # PREDICTZ_URL, WINDRAWWIN_URL).
          FOREBET_URL: ${{ secrets.FOREBET_URL }}
          VITIBET_URL: ${{ secrets.VITIBET_URL }}
          PREDICTZ_URL: ${{ secrets.PREDICTZ_URL }}
          WINDRAWWIN_URL: ${{ secrets.WINDRAWWIN_URL }}
