name: Actualizar resultados reales

# Los partidos del Mundial se juegan en las franjas UTC 16:00-23:59 y
# 00:00-04:59. En esas horas actualizamos CADA 5 MINUTOS (para ver
# resultados casi en vivo). El resto del día, cada hora como red de
# seguridad. update-results hace 1 sola llamada a football-data por
# corrida, así que no choca con el rate-limit (10 req/min).
on:
  schedule:
    - cron: "*/5 16-23 * * *" # cada 5 min, tarde-noche UTC (hay partidos)
    - cron: "*/5 0-4 * * *"   # cada 5 min, madrugada UTC (partidos de noche en América)
    - cron: "0 5-15 * * *"    # cada hora, franja sin partidos (red de seguridad)
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña Actions

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Antes de actualizar resultados, insertamos los cruces de eliminatoria
      # recién confirmados (octavos, cuartos, etc.). Sin esto, update-results no
      # tiene qué actualizar hasta que corra el cron de scrape (cada 12h) y los
      # resultados de una ronda nueva pueden tardar horas en aparecer.
      # Es idempotente (onConflict) y suma 1 sola llamada a football-data.
      - run: npm run seed:knockout
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          FOOTBALL_DATA_COMPETITION: ${{ secrets.FOOTBALL_DATA_COMPETITION }}
      - run: npm run update-results
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Fuente PRIMARIA de estado + marcador en vivo (cruza por external_id).
          # Sin esta key el cron cae solo a TheSportsDB y los partidos del Mundial
          # se quedan colgados en vivo (TheSportsDB crea los eventos con delay).
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          FOOTBALL_DATA_COMPETITION: ${{ secrets.FOOTBALL_DATA_COMPETITION }}
          # Fallback de marcador cuando football-data lo deja en null.
          SPORTSDB_API_KEY: ${{ secrets.SPORTSDB_API_KEY }}
